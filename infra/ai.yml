AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LLM agenda parsing stack (successfulsuccess-ai).
  Lambda runs outside VPC, exposes Function URL (CORS), calls Bedrock (Anthropic).

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Project name used for naming resources.
  ImageUri:
    Type: String
    Description: ECR image URI (including tag or digest).
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
  LambdaTimeout:
    Type: Number
    Default: 30
    Description: Lambda timeout in seconds.
  LogLevel:
    Type: String
    Default: INFO
    Description: Log level for Lambda (e.g., DEBUG, INFO)
  FrontendOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin for frontend

Resources:
  # ---------------------------------------------------------------------
  # IAM role for the agenda parser Lambda
  # ---------------------------------------------------------------------
  AIParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: BedrockInference
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                Resource: '*'

  # ---------------------------------------------------------------------
  # Lambda function (outside VPC)
  # ---------------------------------------------------------------------
  AIParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Parses meeting agenda using Anthropic Bedrock (outside VPC).
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt AIParserRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref AIParserLogGroup
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          AWS_REGION: !Ref "AWS::Region"
          COGNITO_USER_POOL_ID: "us-east-1_3S0UCWv42"
          COGNITO_CLIENT_ID: "3rfpq2s4rhl2ap2n49lvpu0k35"
          COGNITO_REGION: "us-east-1"
          APP_TIMEZONE: "Europe/Kyiv"

  AIParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # Lambda Function URL (public, CORS enabled)
  # ---------------------------------------------------------------------
  AIParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AIParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
        MaxAge: 86400

  # Permission allowing public invocation of the Function URL
  AIParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AIParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  AIParserFunctionName:
    Description: Name of the agenda-parser Lambda function
    Value: !Ref AIParserFunction
  AIParserFunctionUrl:
    Description: Public URL for the parser Lambda
    Value: !GetAtt AIParserFunctionUrl.FunctionUrl
